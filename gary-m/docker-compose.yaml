networks:
  vanet:
    name: vanet

volumes:
  vadb:

services:
  vadb:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: vadb
    networks:
      - vanet
    profiles:
      - db
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "5m"
    volumes:
      - vadb:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -C -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-password_123}"
      MSSQL_PID: "${MSSQL_PID:-Developer}"

  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    networks:
      - vanet
    profiles:
      - db
    depends_on:
      vadb:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-password_123}"
      PAYEREDI_APP_PASSWORD: "${PAYEREDI_APP_PASSWORD:-payeredi_app_password}"
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -S
      - vadb
      - -C
      - -U
      - sa
      - -P
      - "${MSSQL_SA_PASSWORD:-password_123}"
      - -v
      - "PAYEREDI_APP_PASSWORD=${PAYEREDI_APP_PASSWORD:-payeredi_app_password}"
      - -i
      - /scripts/bootstrap.sql
      - -b

  vadb-test:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: vadb-test
    networks:
      - vanet
    profiles:
      - test-db
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "5m"
    tmpfs:
      - /var/opt/mssql/data:uid=10001,gid=0,mode=0770,size=2g
      - /var/opt/mssql/log:uid=10001,gid=0,mode=0770,size=512m
      - /var/opt/mssql/secrets:uid=10001,gid=0,mode=0770,size=64m
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -C -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-password_123}"
      MSSQL_PID: "${MSSQL_PID:-Developer}"

  db-init-test:
    image: mcr.microsoft.com/mssql/server:2025-latest
    networks:
      - vanet
    profiles:
      - test-db
    depends_on:
      vadb-test:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-password_123}"
      PAYEREDI_APP_PASSWORD: "${PAYEREDI_APP_PASSWORD:-payeredi_app_password}"
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -S
      - vadb-test
      - -C
      - -U
      - sa
      - -P
      - "${MSSQL_SA_PASSWORD:-password_123}"
      - -v
      - "PAYEREDI_APP_PASSWORD=${PAYEREDI_APP_PASSWORD:-payeredi_app_password}"
      - -i
      - /scripts/bootstrap.sql
      - -b
